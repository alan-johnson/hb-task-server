name: CLA Assistant

# Requires a repository secret named CLA_SIGNATURES_TOKEN:
# a fine-grained or classic PAT with `repo` scope, used by the action to
# commit signature records to the `cla-signatures` branch. The default
# GITHUB_TOKEN cannot write to a branch outside the PR's merge context.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/alan-johnson/hb-task-server/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: alan-johnson,dependabot[bot],*[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thanks for your contribution. Before this can be merged, all
            contributors must sign the [Contributor License Agreement](https://github.com/alan-johnson/hb-task-server/blob/main/CLA.md).


            **Please note:** `hb-task-server` is **not** an open source project.
            The CLA assigns copyright and patent rights in your contribution to
            HANDSBREADTH LLC, and grants you no license under Handsbreadth
            patent rights. Please read it before signing.


            To sign, post a comment on this pull request with exactly the
            following text:
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thank you.
