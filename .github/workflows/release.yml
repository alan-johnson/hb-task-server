name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14  # Apple Silicon runner — required for arm64 SEA build

    permissions:
      contents: write  # allows gh release create

    steps:
      - uses: actions/checkout@v4

      # nodejs.org Node.js (not Homebrew) is required for Single Executable Application (SEA) fuse support
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install postject (required for SEA blob injection)
        run: npm install -g postject

      - name: Build
        run: ./build.sh

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/hb-task-server-arm64.zip \
            --title "hb-task-server ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --draft
